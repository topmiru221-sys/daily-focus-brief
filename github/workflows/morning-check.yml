name: Morning Check 08-00 TW
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/morning_check.py
      - name: Commit generated changes
        run: |
          git config user.name "daily-focus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "auto: morning completeness check"
          git push
