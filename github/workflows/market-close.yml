name: Market Close 17-30 TW
on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/market_close.py
      - name: Commit generated changes
        run: |
          git config user.name "daily-focus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "auto: market close update"
          git push
