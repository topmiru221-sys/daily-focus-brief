name: History Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
           fetch-depth: 0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill official stock history
        run: python src/fetchers/fetch_history.py

      - name: Rebuild sector radar with moving averages
        run: python src/analyzers/analyze_sectors.py

      - name: Commit history and sector breadth
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/analysis/sectors
          git commit -m "data: backfill official price history and moving averages"

          git pull --rebase origin main
          git push origin HEAD:main
