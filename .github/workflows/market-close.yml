name: Market Close

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-close
  cancel-in-progress: false

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch TWSE official data
        run: python src/fetchers/fetch_twse.py

      - name: Fetch TPEx official data
        run: python src/fetchers/fetch_tpex.py

      - name: Fetch TAIFEX official data
        run: python src/fetchers/fetch_taifex.py

      - name: Normalize and validate market data
        run: python src/normalizers/normalize_market.py

      - name: Analyze institutional trading
        run: python src/analyzers/analyze_institutional.py

      - name: Commit generated data
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/normalized data/analysis
          git commit -m "data: update market and institutional analysis"
          git push
