<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個股風險計畫</title><link rel="stylesheet" href="./assets/styles.css"></head><body><header class="hero"><div><p class="eyebrow">RISK ENGINE ALPHA</p><h1>個股風險計畫</h1><p class="muted">先決定最多能虧多少，再決定能買多少。</p></div><a class="pill" href="./">返回首頁</a></header><main class="container"><section class="grid hero-grid"><article class="card"><h2>輸入交易計畫</h2><div class="form-grid"><label>股票代號<input id="code"></label><label>進場價<input id="entry" type="number"></label><label>停損／失效價<input id="stop" type="number"></label><label>第一目標<input id="t1" type="number"></label><label>第二目標<input id="t2" type="number"></label><label>總資金<input id="capital" type="number" value="1000000"></label><label>單筆最大風險 %<input id="rp" type="number" value="1" step="0.1"></label></div><button id="calc" class="primary-btn">計算</button></article><article class="card"><h2>結果</h2><div id="out" class="metric-grid"><div class="metric"><strong>等待輸入</strong></div></div><div class="warning-list">⚠ 停損價應建立在技術結構失效，而不是只為符合百分比。<br>⚠ Alpha 版先手動輸入支撐與目標，後續接自動技術分析。</div></article></section></main><script>const n=id=>Number(document.getElementById(id).value||0);calc.onclick=()=>{let e=n('entry'),s=n('stop'),a=n('t1'),b=n('t2'),c=n('capital'),r=n('rp');if(!(e>0&&s>0&&s<e)){out.innerHTML='<div class="metric"><strong>請確認進場與停損</strong></div>';return}let risk=(e-s)/e*100,budget=c*r/100,shares=Math.floor(budget/(e-s)),lots=Math.floor(shares/1000),rr=x=>x>e?(x-e)/(e-s):0;out.innerHTML=`<div class="metric"><span>回檔風險</span><strong class="negative">-${risk.toFixed(2)}%</strong></div><div class="metric"><span>最大損失</span><strong>${budget.toLocaleString()} 元</strong></div><div class="metric"><span>目標1空間</span><strong class="positive">${a?((a-e)/e*100).toFixed(2)+'%':'—'}</strong></div><div class="metric"><span>目標1 R/R</span><strong>${a?'1 : '+rr(a).toFixed(2):'—'}</strong></div><div class="metric"><span>目標2空間</span><strong class="positive">${b?((b-e)/e*100).toFixed(2)+'%':'—'}</strong></div><div class="metric"><span>目標2 R/R</span><strong>${b?'1 : '+rr(b).toFixed(2):'—'}</strong></div><div class="metric"><span>理論股數</span><strong>${shares.toLocaleString()} 股</strong></div><div class="metric"><span>整張上限</span><strong>${lots} 張</strong></div>`}</script></body></html>
