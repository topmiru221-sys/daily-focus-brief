<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Intelligence｜Daily Focus Brief</title><link rel="stylesheet" href="./assets/styles.css"><style>
.rank-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.theme-card{cursor:pointer}.theme-card:hover{transform:translateY(-1px)}.strength{font-size:2rem;font-weight:900}.state{font-weight:800}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.mini{background:var(--panel2);padding:10px;border-radius:12px}.mini span{display:block;font-size:.76rem;color:var(--muted)}.sector-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.sector-links a{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.leader-table{margin-top:12px}@media(max-width:900px){.rank-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header class="hero"><div><p class="eyebrow">THEME INTELLIGENCE · V5.4.33</p><h1>主題輪動情報</h1><p id="updated" class="muted">資料載入中…</p></div><div><a class="chip link-chip" href="./sector.html">族群中心</a> <a class="chip link-chip" href="./">返回首頁</a></div></header>
<main class="container"><section class="panel"><p class="eyebrow">MEGA THEME RANKING</p><h2>今天資金正在往哪裡集中？</h2><p class="muted">以資金、持續度、上漲廣度、60MA 結構與 Decision 五項合成。資料不足時不硬算分數。</p><div id="mega" class="rank-grid"></div></section>
<section class="section-block"><div class="section-head"><div><p class="eyebrow">THEME RANKING</p><h2>Theme 強度排序</h2></div></div><div id="themes" class="rank-grid"></div></section></main>
<script>
const f=v=>v==null?'—':Number(v).toFixed(1);const card=x=>`<article class="panel theme-card"><div class="panel-head"><div><p class="eyebrow">#${x.rank}</p><h2>${x.name}</h2></div><div class="strength">${x.strength_score??'—'}</div></div><div class="state">${x.state}</div><div class="metrics"><div class="mini"><span>資金</span><strong>${f(x.flow_score)}</strong></div><div class="mini"><span>持續度</span><strong>${f(x.persistence_ratio_pct)}%</strong></div><div class="mini"><span>上漲廣度</span><strong>${f(x.advance_ratio_pct)}%</strong></div><div class="mini"><span>站上60MA</span><strong>${f(x.above_60ma_ratio_pct)}%</strong></div><div class="mini"><span>Decision</span><strong>${f(x.average_decision_score)}</strong></div></div><div class="sector-links">${(x.sectors||[]).map(s=>`<a href="./sector.html?id=${s.id}">${s.name}</a>`).join('')}</div>${(x.leaders||[]).length?`<div class="table-wrap leader-table"><table><thead><tr><th>Leader</th><th>族群</th><th>Decision</th><th>Risk</th><th>R/R</th></tr></thead><tbody>${x.leaders.slice(0,3).map(l=>`<tr><td><a href="./decision.html?code=${l.code}">${l.name||l.code} ${l.code}</a></td><td>${l.sector_name}</td><td>${l.decision_score??'—'}</td><td>${l.risk_pct==null?'—':f(l.risk_pct)+'%'}</td><td>${l.rr1??'—'}</td></tr>`).join('')}</tbody></table></div>`:''}</article>`;
fetch('./data/theme_intelligence.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(db=>{updated.textContent=`資料日期：${db.data_date||'待更新'}｜Mega Theme ${db.mega_theme_count||0}｜Theme ${db.theme_count||0}`;mega.innerHTML=(db.mega_themes||[]).map(card).join('')||'<p>資料不足</p>';themes.innerHTML=(db.themes||[]).map(card).join('')||'<p>資料不足</p>'}).catch(e=>updated.textContent='載入失敗：'+e.message);
</script><script src="./assets/global-stock-name.js"></script><script src="./assets/site-audit-v5431.js"></script></body></html>
