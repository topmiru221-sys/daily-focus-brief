<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Rotation｜Daily Focus Brief</title><link rel="stylesheet" href="./assets/styles.css"><style>.rank-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.strength{font-size:2rem;font-weight:900}.rotation{font-weight:900;font-size:1.05rem}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.mini{background:var(--panel2);padding:10px;border-radius:12px}.mini span{display:block;font-size:.76rem;color:var(--muted)}.delta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sector-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.sector-links a,.delta span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:5px 8px}@media(max-width:900px){.rank-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="hero"><div><p class="eyebrow">THEME ROTATION · V5.4.34</p><h1>主題輪動與確認</h1><p id="updated" class="muted">載入中…</p></div><div><a class="chip link-chip" href="./sector.html">族群中心</a> <a class="chip link-chip" href="./">返回首頁</a></div></header><main class="container"><section class="panel"><h2>Mega Theme Rotation</h2><p class="muted">不只看今天強弱，也看是否新轉強、持續、加速、降溫或退潮。</p><div id="mega" class="rank-grid"></div></section><section class="section-block"><h2>Theme Rotation</h2><div id="themes" class="rank-grid"></div></section></main><script>
const f=v=>v==null?'—':Number(v).toFixed(1),d=v=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(1);const card=x=>`<article class="panel"><div class="panel-head"><div><p class="eyebrow">#${x.rank}</p><h2>${x.name}</h2></div><div class="strength">${x.strength_score??'—'}</div></div><div class="rotation">${x.rotation_state||x.state}</div><div class="delta"><span>1D ${d(x.score_change_1d)}</span><span>5D ${d(x.score_change_5d)}</span><span>確認 ${x.confirmation_days||0} 日</span></div><div class="metrics"><div class="mini"><span>資金</span><strong>${f(x.flow_score)}</strong></div><div class="mini"><span>持續度</span><strong>${f(x.persistence_ratio_pct)}%</strong></div><div class="mini"><span>廣度</span><strong>${f(x.advance_ratio_pct)}%</strong></div><div class="mini"><span>60MA</span><strong>${f(x.above_60ma_ratio_pct)}%</strong></div><div class="mini"><span>Decision</span><strong>${f(x.average_decision_score)}</strong></div></div><div class="sector-links">${(x.sectors||[]).map(s=>`<a href="./sector.html?id=${s.id}">${s.name}</a>`).join('')}</div></article>`;fetch('./data/theme_intelligence.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(db=>{updated.textContent=`資料日期：${db.data_date||'—'}｜歷史可用 ${db.history_days_available||0} 日｜${db.schema_version||''}`;mega.innerHTML=(db.mega_themes||[]).map(card).join('');themes.innerHTML=(db.themes||[]).map(card).join('')}).catch(e=>updated.textContent='載入失敗：'+e.message)
</script><script src="./assets/global-stock-name.js"></script><script src="./assets/site-audit-v5431.js"></script></body></html>
