<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Focus Brief</title>
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<header class="hero">
<div><p class="eyebrow">DAILY FOCUS BRIEF</p><h1>台股盤後決策儀表板</h1><p id="updatedAt" class="muted">資料載入中…</p></div>
<div id="marketBadge" class="market-badge neutral">待更新</div>
</header>
<main class="container">
<section class="grid hero-grid">
<article class="card">
<div class="card-head"><h2>今日市場</h2><span id="marketStatus" class="pill">待更新</span></div>
<div id="marketSummary" class="summary-copy">等待分析資料。</div>
<div id="marketSignals" class="signal-list"></div>
</article>
<article class="card">
<div class="card-head"><h2>資料完整度</h2></div>
<div id="coverage" class="metric-grid"></div>
<div id="warnings" class="warning-list"></div>
</article>
</section>

<section class="section-block">
<div class="section-title"><div><p class="eyebrow">SECTOR RADAR</p><h2>熱門族群追蹤</h2></div></div>
<div id="sectorGrid" class="sector-grid"></div>
</section>

<section class="section-block">
<div class="section-title"><div><p class="eyebrow">INSTITUTIONAL FLOW</p><h2>每日盤後籌碼變化</h2></div></div>
<div class="tabs">
<button class="tab active" data-tab="foreign_buy_top50">外資買超</button>
<button class="tab" data-tab="foreign_sell_top50">外資賣超</button>
<button class="tab" data-tab="investment_trust_buy_top50">投信買超</button>
<button class="tab" data-tab="investment_trust_sell_top50">投信賣超</button>
</div>
<div class="table-wrap"><table>
<thead><tr><th>排名</th><th>市場</th><th>代碼</th><th>名稱</th><th>買賣超（張）</th></tr></thead>
<tbody id="institutionalTable"></tbody>
</table></div>
</section>

<section class="section-block">
<div class="section-title"><div><p class="eyebrow">NEXT</p><h2>即將加入</h2></div></div>
<div class="future-grid">
<article class="future-card"><h3>權證熱度</h3><p>待接入可核對來源後更新。</p></article>
<article class="future-card"><h3>ETF 追蹤</h3><p>待接入淨值與折溢價資料。</p></article>
<article class="future-card"><h3>明日觀察池</h3><p>待法人、族群、技術面交叉完成。</p></article>
</div>
</section>
</main>
<footer>資料以官方來源為優先；不足處顯示待更新，不使用推測數字。</footer>
<script src="./assets/app.js"></script>
</body></html>
