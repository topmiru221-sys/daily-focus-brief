<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Development Dashboard｜Daily Focus Brief</title><link rel="stylesheet" href="./assets/styles.css"><style>
.progress-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.big-progress{font-size:3.4rem;font-weight:900}.track{height:12px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--accent);border-radius:999px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.status-card,.module{background:var(--panel2);border-radius:14px;padding:14px}.module-list{display:grid;gap:12px;margin-top:16px}.module-top{display:grid;grid-template-columns:1.2fr 100px 1fr;gap:14px;align-items:center}.module-name{font-weight:800}.module-note{color:var(--muted);font-size:.9rem}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.8rem}.s-usable{color:var(--green)}.s-partial{color:var(--yellow)}.s-not_started{color:var(--red)}.queue-item{display:grid;grid-template-columns:50px 1fr 100px;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.issue{padding:12px 0;border-top:1px solid var(--line)}.filter-row{display:flex;gap:8px;flex-wrap:wrap}.filter-row button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:999px;cursor:pointer}.filter-row button.active{background:var(--accent);color:#071021;font-weight:800}@media(max-width:850px){.progress-hero{grid-template-columns:1fr}.module-top{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr 1fr}.queue-item{grid-template-columns:40px 1fr}}</style></head><body>
<header class="hero"><div><p class="eyebrow">PROJECT CONTROL</p><h1>Development Dashboard</h1><p id="updated" class="muted">載入中…</p></div><a class="chip link-chip" href="./">返回 Daily Focus Brief</a></header><main class="container">
<section class="progress-hero"><article class="panel"><p class="eyebrow">BASELINE PROGRESS</p><div id="overall" class="big-progress">—</div><div class="track"><div id="overallFill" class="fill" style="width:0"></div></div><p id="sprintGoal" class="lead"></p><div id="summary" class="status-grid"></div></article><article class="panel"><p class="eyebrow">CURRENT SPRINT</p><h2 id="sprint"></h2><div id="rules" class="reason-list"></div></article></section>
<section class="section-block"><div class="section-head"><div><p class="eyebrow">ORIGINAL SITE BASELINE</p><h2>最初核心模組</h2></div><div class="filter-row"><button class="active" data-filter="all">全部</button><button data-filter="usable">可用</button><button data-filter="partial">部分</button><button data-filter="not_started">未完成</button></div></div><div id="baseline" class="module-list"></div></section>
<section class="two-col section-block"><article class="panel"><p class="eyebrow">EXECUTION QUEUE</p><h2>接下來照這個順序</h2><div id="queue"></div></article><article class="panel"><p class="eyebrow">KNOWN ISSUES</p><h2>目前已知缺口</h2><div id="issues"></div></article></section>
<section class="section-block"><div class="section-head"><div><p class="eyebrow">ADDED LATER</p><h2>後續新增功能</h2></div><span class="chip">Baseline 90% 前不搶優先</span></div><div id="added" class="module-list"></div></section></main><footer>這一頁是專案唯一進度來源。功能沒在這裡變綠，就不算真正完成。</footer>
<script>
let db,filter="all";const sn={usable:"🟢 可用",partial:"🟡 部分完成",not_started:"🔴 未完成"};
function mh(x){return `<article class="module"><div class="module-top"><div><span class="badge s-${x.status}">${sn[x.status]||x.status}</span><div class="module-name">${x.name}</div></div><div><strong>${x.progress}%</strong><div class="track"><div class="fill" style="width:${x.progress}%"></div></div></div><div class="module-note">${x.note}</div></div></article>`}
function render(){updated.textContent=`${db.version}｜更新 ${db.updated_at}`;overall.textContent=db.overall_progress_pct+"%";overallFill.style.width=db.overall_progress_pct+"%";sprint.textContent=db.current_sprint;sprintGoal.textContent=db.sprint_goal;summary.innerHTML=`<div class="status-card">🟢 可用<strong>${db.summary.usable}</strong></div><div class="status-card">🟡 部分<strong>${db.summary.partial}</strong></div><div class="status-card">🔴 未完成<strong>${db.summary.not_started}</strong></div>`;rules.innerHTML=db.rules.map(x=>"✓ "+x).join("<br>");baseline.innerHTML=db.modules.filter(x=>x.group==="原始 SITE"&&(filter==="all"||x.status===filter)).map(mh).join("");added.innerHTML=db.modules.filter(x=>x.group==="後續新增").map(mh).join("");queue.innerHTML=db.current_queue.map(x=>`<div class="queue-item"><strong>#${x.order}</strong><div><strong>${x.module}</strong><div class="muted">${x.target}</div></div><span class="badge">${x.state}</span></div>`).join("");issues.innerHTML=db.known_issues.map(x=>`<div class="issue">⚠ ${x}</div>`).join("")}
fetch("./data/project_status.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(x=>{db=x;render()}).catch(e=>updated.textContent="載入失敗："+e.message);document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()}));
</script></body></html>
