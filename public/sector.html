<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sector Center｜Daily Focus Brief</title><link rel="stylesheet" href="./assets/styles.css"><style>.sector-picker{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.sector-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:10px 14px;cursor:pointer}.sector-btn.active{background:var(--accent);color:#071021;font-weight:800}.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.role{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:4px 8px;display:inline-block}@media(max-width:900px){.summary-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header class="hero"><div><p class="eyebrow">SECTOR INTELLIGENCE CENTER</p><h1 id="pageTitle">族群情報中心</h1><p id="updated" class="muted">資料載入中…</p></div><a class="chip link-chip" href="./">返回首頁</a></header>
<main class="container"><section class="panel"><div class="section-head"><div><p class="eyebrow">SECTORS</p><h2>選擇族群</h2></div></div><div id="picker" class="sector-picker"></div></section><section id="summary" class="section-block"></section><section class="section-block"><div class="section-head"><div><p class="eyebrow">CONCEPT STOCKS</p><h2>概念股 × Decision × Risk</h2></div></div><p class="muted">Alpha版先把族群成分股與 Decision Engine 串起來。Leader 為目前 Decision Score 較高的研究領先股，不等同「主力」認定。</p><div class="table-wrap"><table><thead><tr><th>角色</th><th>代號</th><th>名稱</th><th>Decision</th><th>收盤</th><th>20MA距離</th><th>60MA距離</th><th>回檔風險</th><th>R/R</th><th>狀態</th></tr></thead><tbody id="stocks"></tbody></table></div></section></main>
<script>let db=null,current=null;const fmt=v=>v==null?'—':Number(v).toFixed(2);const toneRisk=v=>v==null?'':v<=5?'good':v<=8?'warn':'bad';function querySector(){return new URLSearchParams(location.search).get('id')}function renderPicker(){picker.innerHTML=(db.sectors||[]).map(s=>`<button class="sector-btn ${current&&s.id===current.id?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');document.querySelectorAll('.sector-btn').forEach(b=>b.onclick=()=>select(b.dataset.id,true))}function select(id,push=false){current=(db.sectors||[]).find(s=>s.id===id)||(db.sectors||[])[0];if(!current)return;if(push)history.replaceState(null,'',`?id=${encodeURIComponent(current.id)}`);pageTitle.textContent=current.name+'｜族群情報中心';renderPicker();renderSummary();renderStocks()}function renderSummary(){const s=current,l=s.leader||{};summary.innerHTML=`<article class="panel"><div class="panel-head"><div><p class="eyebrow">${s.id}</p><h2>${s.name}</h2></div><div class="score">${s.today_rank?'#'+s.today_rank:'—'}</div></div><div class="summary-grid"><div class="metric"><span class="muted">今日漲跌</span><strong>${fmt(s.average_change_pct)}%</strong></div><div class="metric"><span class="muted">資金分數</span><strong>${fmt(s.flow_score)}</strong></div><div class="metric"><span class="muted">近5日持續</span><strong>${fmt(s.persistence_ratio_pct)}%</strong></div><div class="metric"><span class="muted">站上60MA</span><strong>${fmt(s.above_60ma_ratio_pct)}%</strong></div><div class="metric"><span class="muted">Decision覆蓋</span><strong>${s.decision_coverage_count}/${s.member_count}</strong></div></div><p class="lead">${s.flow_state||'資金狀態待更新'}｜${s.persistence_state||'持續度資料累積中'}</p>${l.code?`<p>研究領先股：<a href="./decision.html?code=${l.code}"><strong>${l.name||l.code} ${l.code}</strong></a>｜Decision ${l.decision_score??'—'}</p>`:''}</article>`}function renderStocks(){stocks.innerHTML=(current.stocks||[]).map((x,i)=>{const role=i===0&&x.decision_score!=null?'Leader':x.source_pool==='research'?'Research':x.source_pool==='watch'?'Watch':x.source_pool==='general'?'General':'Data pending';return `<tr><td><span class="role">${role}</span></td><td><a href="./decision.html?code=${x.code}">${x.code}</a></td><td><strong>${x.name||x.code}</strong></td><td>${x.decision_score==null?'—':x.decision_score+'｜'+(x.grade||'')}</td><td>${x.close??'—'}</td><td>${x.distance_ma20_pct==null?'—':fmt(x.distance_ma20_pct)+'%'}</td><td>${x.distance_ma60_pct==null?'—':fmt(x.distance_ma60_pct)+'%'}</td><td class="${toneRisk(x.risk_pct)}">${x.risk_pct==null?'—':fmt(x.risk_pct)+'%'}</td><td>${x.rr1??'—'}</td><td>${x.conclusion||((x.risk_flags||[])[0]||'待更新')}</td></tr>`}).join('')}fetch('./data/sector_center.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{db=x;updated.textContent=`資料日期：${x.data_date||'待更新'}｜族群 ${x.sector_count||0} 個`;select(querySector(),false)}).catch(e=>updated.textContent='載入失敗：'+e.message)</script></body></html>
