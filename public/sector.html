<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sector Center｜Daily Focus Brief</title><link rel="stylesheet" href="./assets/styles.css"><style>
.theme-picker,.sector-picker{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.theme-btn,.sector-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 13px;cursor:pointer}.theme-btn.active,.sector-btn.active{background:var(--accent);color:#071021;font-weight:800}.taxonomy{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.tax-chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.health-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}.leader-box{background:var(--panel2);border-radius:16px;padding:18px}.leader-score{font-size:2rem;font-weight:900}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.role{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:4px 8px;display:inline-block}.source-note{font-size:.85rem;color:var(--muted);margin-top:10px}.empty-note{padding:18px;color:var(--muted)}@media(max-width:900px){.summary-grid{grid-template-columns:repeat(2,1fr)}.health-grid{grid-template-columns:1fr}}
</style></head><body><header class="hero"><div><p class="eyebrow">SECTOR INTELLIGENCE CENTER · V5.4.32</p><h1 id="pageTitle">族群情報中心</h1><p id="updated" class="muted">資料載入中…</p></div><a class="chip link-chip" href="./">返回首頁</a></header><main class="container"><section class="panel"><div class="section-head"><div><p class="eyebrow">MULTI-THEME TAXONOMY</p><h2>主題 → 族群</h2></div><span id="dataMode" class="chip">載入中</span></div><div id="themes" class="theme-picker"></div><div id="picker" class="sector-picker"></div></section><section id="summary" class="section-block"></section><section class="section-block"><div class="section-head"><div><p class="eyebrow">CONCEPT STOCKS</p><h2>概念股 × Decision × Risk</h2></div></div><p class="muted">同一家公司可同時屬於多個投資主題；先比較風險與位置，再看報酬空間。</p><div class="table-wrap"><table><thead><tr><th>角色</th><th>代號</th><th>名稱</th><th>Decision</th><th>收盤</th><th>20MA距離</th><th>60MA距離</th><th>回檔風險</th><th>R/R</th><th>狀態</th></tr></thead><tbody id="stocks"></tbody></table></div></section></main><script>
let db=null,current=null,activeTheme='ALL';const fmt=v=>v==null||Number.isNaN(Number(v))?'—':Number(v).toFixed(2);const toneRisk=v=>v==null?'':Number(v)<=5?'good':Number(v)<=8?'warn':'bad';const qid=()=>new URLSearchParams(location.search).get('id');async function json(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${path} ${r.status}`);return r.json()}
function mega(s){return s.taxonomy?.mega_theme||[]}function visible(){return (db.sectors||[]).filter(s=>activeTheme==='ALL'||mega(s).includes(activeTheme))}
function renderThemes(){const list=db.taxonomy_index?.mega_themes||[...new Set((db.sectors||[]).flatMap(mega))].sort();themes.innerHTML=['ALL',...list].map(t=>`<button class="theme-btn ${t===activeTheme?'active':''}" data-theme="${t}">${t==='ALL'?'全部主題':t}</button>`).join('');document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>{activeTheme=b.dataset.theme;const rows=visible();if(!rows.some(s=>s.id===current?.id))current=rows[0]||null;renderThemes();renderPicker();renderAll()})}
function renderPicker(){picker.innerHTML=visible().map(s=>`<button class="sector-btn ${current&&s.id===current.id?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');document.querySelectorAll('.sector-btn').forEach(b=>b.onclick=()=>select(b.dataset.id,true))}
function select(id,push=false){current=(db.sectors||[]).find(s=>s.id===id)||visible()[0]||(db.sectors||[])[0];if(push&&current)history.replaceState(null,'',`?id=${encodeURIComponent(current.id)}`);renderPicker();renderAll()}
function renderAll(){if(!current){summary.innerHTML='<article class="panel empty-note">目前沒有族群資料。</article>';stocks.innerHTML='';return}pageTitle.textContent=current.name+'｜族群情報中心';renderSummary();renderStocks()}
function renderSummary(){const s=current,l=s.leader||{},risk=l.risk_pct,riskLabel=risk==null?'待更新':risk<=5?'低':risk<=8?'中':'高',riskClass=risk==null?'':risk<=5?'good':risk<=8?'warn':'bad';const tax=[...(s.taxonomy?.mega_theme||[]),...(s.taxonomy?.theme||[]),...(s.taxonomy?.subthemes||[])];summary.innerHTML=`<article class="panel"><div class="panel-head"><div><p class="eyebrow">${s.id}</p><h2>${s.name}</h2></div><div class="score">${s.today_rank?'#'+s.today_rank:'—'}</div></div><div class="taxonomy">${tax.map(x=>`<span class="tax-chip">${x}</span>`).join('')||'<span class="tax-chip">Taxonomy pending</span>'}</div><div class="summary-grid"><div class="metric"><span class="muted">今日漲跌</span><strong>${fmt(s.average_change_pct)}%</strong></div><div class="metric"><span class="muted">資金分數</span><strong>${fmt(s.flow_score)}</strong></div><div class="metric"><span class="muted">近5日持續</span><strong>${fmt(s.persistence_ratio_pct)}%</strong></div><div class="metric"><span class="muted">站上60MA</span><strong>${fmt(s.above_60ma_ratio_pct)}%</strong></div><div class="metric"><span class="muted">Decision覆蓋</span><strong>${s.decision_coverage_count??0}/${s.member_count??0}</strong></div></div><div class="health-grid"><div><p class="lead">${s.flow_state||'資金狀態待更新'}｜${s.persistence_state||'持續度資料累積中'}</p><div class="reason-list">族群分類：${s.classification||'待更新'}<br>資金分數變化：${fmt(s.score_change)}<br>有效歷史天數：${s.effective_days??'—'}</div></div><div class="leader-box"><p class="eyebrow">CURRENT RESEARCH LEADER</p>${l.code?`<h3><a href="./decision.html?code=${l.code}">${l.name||l.code} ${l.code}</a></h3><div class="leader-score">${l.decision_score??'—'}｜${l.grade||''}</div><p>回檔風險：<span class="${riskClass}">${risk==null?'—':fmt(risk)+'%'}（${riskLabel}）</span><br>第一目標 R/R：${l.rr1??'—'}<br>價格日期：${l.price_date||'待更新'}</p>`:'<p>尚無完整 Decision Card。</p>'}</div></div><p class="source-note">資料日期：${db.data_date||'待更新'}｜Schema：${db.schema_version||'—'}。Decision 高不代表適合追價。</p></article>`}
function renderStocks(){const rows=current.stocks||[];stocks.innerHTML=rows.length?rows.map((x,i)=>{const role=i===0&&x.decision_score!=null?'Leader':x.source_pool==='research'?'Research':x.source_pool==='watch'?'Watch':x.source_pool==='general'?'General':'Data pending';return `<tr><td><span class="role">${role}</span></td><td><a href="./decision.html?code=${x.code}">${x.code}</a></td><td><a href="./decision.html?code=${x.code}"><strong>${x.name||x.code}</strong></a></td><td>${x.decision_score==null?'—':x.decision_score+'｜'+(x.grade||'')}</td><td>${x.close??'—'}</td><td>${x.distance_ma20_pct==null?'—':fmt(x.distance_ma20_pct)+'%'}</td><td>${x.distance_ma60_pct==null?'—':fmt(x.distance_ma60_pct)+'%'}</td><td class="${toneRisk(x.risk_pct)}">${x.risk_pct==null?'—':fmt(x.risk_pct)+'%'}</td><td>${x.rr1??'—'}</td><td>${x.conclusion||((x.risk_flags||[])[0]||'待更新')}</td></tr>`}).join(''):'<tr><td colspan="10" class="empty-note">目前沒有成分股資料。</td></tr>'}
loadDB=async()=>{try{const x=await json('./data/sector_center.json');dataMode.textContent=x.schema_version?.includes('5.4.32')?'Multi-Theme':'Legacy';return x}catch(e){throw new Error('Sector Center 載入失敗：'+e.message)}};loadDB().then(x=>{db=x;updated.textContent=`資料日期：${x.data_date||'待更新'}｜族群 ${x.sector_count||0} 個｜Multi-Theme Taxonomy`;current=(x.sectors||[]).find(s=>s.id===qid())||(x.sectors||[])[0];renderThemes();renderPicker();renderAll()}).catch(e=>{updated.textContent='載入失敗：'+e.message;summary.innerHTML=`<article class="panel"><h2>族群資料暫時無法載入</h2><p class="warning-list">${e.message}</p></article>`})
</script>
<script src="./assets/global-stock-name.js"></script>
<script src="./assets/site-audit-v5431.js"></script>
</body>
</html>
